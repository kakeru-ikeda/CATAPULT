<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Runway fading into the horizon -->
    <linearGradient id="runway-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0" />
      <stop offset="30%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="1" />
    </linearGradient>
    
    <!-- Vibrant gradient for Copilot to ensure visibility on all backgrounds -->
    <linearGradient id="copilot-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    
    <!-- Energy core glow -->
    <radialGradient id="core-glow">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Abstract Perspective Runway -->
  <g stroke="url(#runway-grad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main thrust rails -->
    <path d="M 140 480 L 235 120" stroke-width="8" />
    <path d="M 372 480 L 277 120" stroke-width="8" />
    
    <!-- Outer acceleration guides -->
    <path d="M 60 480 L 210 120" stroke-width="3" opacity="0.6" />
    <path d="M 452 480 L 302 120" stroke-width="3" opacity="0.6" />
    
    <!-- Center launch line (dashed) -->
    <line x1="256" y1="480" x2="256" y2="120" stroke-width="6" stroke-dasharray="16 16" opacity="0.9" />
    
    <!-- Perspective horizontal speed/distance markers -->
    <line x1="117" y1="400" x2="395" y2="400" stroke-width="5" opacity="0.8" />
    <line x1="160" y1="310" x2="352" y2="310" stroke-width="4" opacity="0.6" />
    <line x1="190" y1="230" x2="322" y2="230" stroke-width="3" opacity="0.4" />
    <line x1="215" y1="160" x2="297" y2="160" stroke-width="2" opacity="0.2" />
  </g>

  <!-- Propulsive Trail / Launch Blur -->
  <path d="M 220 370 L 256 60 L 292 370 Z" fill="url(#runway-grad)" opacity="0.25" />

  <!-- Energy sled / Catapult shuttle -->
  <ellipse cx="256" cy="370" rx="110" ry="30" fill="url(#core-glow)" />
  <path d="M 196 370 L 256 355 L 316 370 L 256 385 Z" fill="#E0F2FE" opacity="0.9" />
  <path d="M 180 375 L 256 400 L 332 375" stroke="#38BDF8" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- Copilot Icon (Riding the Catapult on the track) -->
  <!-- Transformed to perfectly sit on the energy sled -->
  <g transform="translate(133.12, 175) scale(0.48)" fill="url(#copilot-grad)">
    <path d="M181.33 266.143c0-11.497 9.32-20.818 20.818-20.818 11.498 0 20.819 9.321 20.819 20.818v38.373c0 11.497-9.321 20.818-20.819 20.818-11.497 0-20.818-9.32-20.818-20.818v-38.373zM308.807 245.325c-11.477 0-20.798 9.321-20.798 20.818v38.373c0 11.497 9.32 20.818 20.798 20.818 11.497 0 20.818-9.32 20.818-20.818v-38.373c0-11.497-9.32-20.818-20.818-20.818z" fill-rule="nonzero"/>
