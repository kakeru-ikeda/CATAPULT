<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
    <defs>
        <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4F46E5"/>
            <stop offset="50%" stop-color="#06B6D4"/>
            <stop offset="100%" stop-color="#38BDF8"/>
        </linearGradient>
        <linearGradient id="launchGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4F46E5"/>
            <stop offset="100%" stop-color="#06B6D4"/>
        </linearGradient>
        <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4F46E5" stop-opacity="0"/>
            <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8"/>
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.5" fill="#1E293B"/>
        </pattern>
        <filter id="glowDot" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    
    <!-- Deep Dark Background with Dot Grid -->
    <rect width="1200" height="300" fill="#0D1117"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- Abstract Ambient Glows -->
    <circle cx="150" cy="150" r="200" fill="#4F46E5" opacity="0.15" filter="blur(60px)"/>
    <circle cx="950" cy="100" r="250" fill="#06B6D4" opacity="0.15" filter="blur(80px)"/>

    <!-- Abstract Catapult Vector Art (Right Side) -->
    <g transform="translate(730, -50) scale(0.70)">
        <!-- スピードライン/軌跡 -->
        <line x1="80" y1="432" x2="192" y2="320" stroke="url(#trailGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="24 24" />
        <!-- 射出されるシャトル/機体 (抽象化された矢印型紙飛行機モチーフ) -->
        <path d="M 64 256 L 416 96 L 256 448 L 224 288 Z" fill="url(#launchGrad)" filter="url(#glowDot)" />
    </g>

    <!-- Typography -->
    <text x="140" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="100" fill="url(#gradText)" letter-spacing="4">CATAPULT</text>
    <text x="145" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="32" fill="#8B949E" letter-spacing="1">Autonomy layer for GitHub Copilot</text>
</svg>
