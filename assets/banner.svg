<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
    <defs>
        <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4F46E5"/>
            <stop offset="50%" stop-color="#A855F7"/>
            <stop offset="100%" stop-color="#EC4899"/>
        </linearGradient>
        <linearGradient id="gradArm" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4F46E5"/>
            <stop offset="100%" stop-color="#EC4899"/>
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.5" fill="#1E293B"/>
        </pattern>
        <filter id="glowDot" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="12" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    
    <!-- Deep Dark Background with Dot Grid -->
    <rect width="1280" height="640" fill="#0B0F19"/>
    <rect width="1280" height="640" fill="url(#grid)"/>

    <!-- Abstract Ambient Glows -->
    <circle cx="150" cy="450" r="300" fill="#4F46E5" opacity="0.15" filter="blur(80px)"/>
    <circle cx="1050" cy="200" r="350" fill="#EC4899" opacity="0.15" filter="blur(100px)"/>

    <!-- Abstract Catapult Vector Art (Right Side) -->
    <g transform="translate(800, 160) scale(1.4)">
        <!-- Base -->
        <path d="M 50 250 L 150 90 L 250 250 Z" fill="none" stroke="#1E293B" stroke-width="20" stroke-linejoin="round"/>
        <line x1="90" y1="190" x2="210" y2="190" stroke="#1E293B" stroke-width="20" stroke-linecap="round"/>
        
        <!-- Swung Arm -->
        <line x1="150" y1="190" x2="300" y2="-20" stroke="url(#gradArm)" stroke-width="24" stroke-linecap="round"/>
        
        <!-- Arc -->
        <path d="M 20 120 C 100 20 220 0 350 -30" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 12"/>
        
        <!-- Projectile -->
        <circle cx="350" cy="-30" r="16" fill="#EC4899" filter="url(#glowDot)"/>
        <circle cx="350" cy="-30" r="8" fill="#FBCFE8"/>
    </g>

    <!-- Typography -->
    <text x="120" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="110" fill="url(#gradText)" letter-spacing="8">CATAPULT</text>
    <text x="125" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="36" fill="#8B949E" letter-spacing="1">Autonomy layer for GitHub Copilot</text>

    <!-- Terminal Prompt Decorator -->
    <rect x="125" y="460" width="380" height="64" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <circle cx="155" cy="492" r="6" fill="#EF4444"/>
    <circle cx="175" cy="492" r="6" fill="#EAB308"/>
    <circle cx="195" cy="492" r="6" fill="#22C55E"/>
    <text x="225" y="499" font-family="monospace" font-size="20" font-weight="600" fill="#38BDF8">@copilot 🚀 deploy</text>
</svg>
