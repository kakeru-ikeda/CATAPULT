<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
    <defs>
        <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4F46E5"/>
            <stop offset="50%" stop-color="#06B6D4"/>
            <stop offset="100%" stop-color="#38BDF8"/>
        </linearGradient>
        <linearGradient id="launchGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4F46E5"/>
            <stop offset="100%" stop-color="#06B6D4"/>
        </linearGradient>
        <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4F46E5" stop-opacity="0"/>
            <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8"/>
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.5" fill="#1E293B"/>
        </pattern>
        <filter id="glowDot" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    
    <!-- Deep Dark Background with Dot Grid -->
    <rect width="600" height="300" fill="#0D1117"/>
    <rect width="600" height="300" fill="url(#grid)"/>

    <!-- Abstract Ambient Glows -->
    <circle cx="100" cy="250" r="150" fill="#4F46E5" opacity="0.15" filter="blur(60px)"/>
    <circle cx="450" cy="50" r="180" fill="#06B6D4" opacity="0.15" filter="blur(80px)"/>

    <!-- Typography -->
    <text x="40" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#gradText)" letter-spacing="2">CATAPULT</text>
    <text x="42" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="18" fill="#8B949E" letter-spacing="0.5">Autonomy layer for GitHub Copilot</text>

    <!-- Terminal Prompt Decorator -->
    <rect x="42" y="185" width="260" height="48" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <circle cx="66" cy="209" r="5" fill="#EF4444"/>
    <circle cx="86" cy="209" r="5" fill="#EAB308"/>
    <circle cx="106" cy="209" r="5" fill="#22C55E"/>
    <text x="130" y="215" font-family="monospace" font-size="15" font-weight="600" fill="#38BDF8">@copilot 🚀 deploy</text>

    <!-- Abstract Catapult Vector Art -->
    <g transform="translate(360, 15) scale(0.50)">
        <line x1="80" y1="432" x2="192" y2="320" stroke="url(#trailGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="24 24" />
        <path d="M 64 256 L 416 96 L 256 448 L 224 288 Z" fill="url(#launchGrad)" filter="url(#glowDot)" />
    </g>
</svg>
